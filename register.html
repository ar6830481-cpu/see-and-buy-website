<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | See & Buy</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f5f5;
        }

        .register-box{
            width:400px;
            max-width:90%;
            margin:70px auto;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:15px;
            background:#d4af37;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#b89020;
        }

        #message{
            margin-top:20px;
            text-align:center;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="register-box">

<h1>Create Account</h1>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<button onclick="registerUser()">
Create Account
</button>

<p id="message"></p>

</div>

<script src="register.js"></script>

</body>

</html>
